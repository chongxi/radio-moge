[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-moge"
version = "0.1.0"
description = "Distill MoGe-2 encoder outputs into a head on frozen C-RADIOv4-H"
requires-python = ">=3.11"
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0", "accelerate==1.12.0",
  "numpy==2.2.6", "pillow==11.3.0", "PyYAML==6.0.2",
  "huggingface-hub==0.36.0", "timm==1.0.22", "einops==0.8.1",
  "scipy==1.16.3", "opencv-python-headless==4.12.0.88",
  "tensorboard==2.20.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.2"]
upstream = ["utils3d-moge @ git+https://github.com/EasternJournalist/utils3d-moge.git@62f09d58509485564e24d5d9f6aac9ee9ebc0c37"]

[project.scripts]
radio-moge-train = "radio_moge.train:main"
radio-moge-eval = "radio_moge.evaluate:main"
radio-moge-export = "radio_moge.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["upstream: requires the pinned MoGe source and utils3d dependencies"]

[tool.ruff]
line-length = 100
