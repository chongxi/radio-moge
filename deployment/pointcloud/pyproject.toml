[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-moge-inference"
version = "0.2.0"
description = "RADIO-v4-H to filtered MoGe-v2 colored point clouds"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["THIRD_PARTY.md"]
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0", "numpy==2.2.6",
  "pillow==11.3.0", "PyYAML==6.0.2", "huggingface-hub>=0.36,<1",
  "timm==1.0.22", "einops==0.8.1", "scipy==1.16.3",
  "opencv-python-headless==4.12.0.88", "filelock>=3.18,<4",
  "utils3d-moge==1.7",
]

[project.scripts]
radio-moge-pointcloud = "radio_moge.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
