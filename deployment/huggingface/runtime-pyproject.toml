[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-moge-inference"
version = "0.1.0"
description = "Perception-style inference for the RADIO to MoGe-2 adapter"
requires-python = ">=3.11"
license-files = ["THIRD_PARTY.md"]
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0", "numpy==2.2.6",
  "pillow==11.3.0", "PyYAML==6.0.2", "huggingface-hub>=0.36,<1",
  "timm==1.0.22", "einops==0.8.1", "scipy==1.16.3",
  "opencv-python-headless==4.12.0.88", "filelock>=3.18,<4",
  "utils3d-moge @ git+https://github.com/EasternJournalist/utils3d-moge.git@62f09d58509485564e24d5d9f6aac9ee9ebc0c37",
]

[tool.setuptools.packages.find]
where = ["src"]
